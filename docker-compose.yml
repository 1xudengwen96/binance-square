services:
  squareforge:
    build: .
    image: squareforge:latest
    container_name: squareforge
    restart: unless-stopped
    init: true

    # Public deployment: the application also permits same-origin remote mutations.
    ports:
      - "0.0.0.0:8787:8787"

    volumes:
      # A fresh named volume inherits the image directory's non-root ownership.
      # Holds the SQLite database, posting keys, backups and chart images.
      - squareforge-data:/app/data

    environment:
      HOST: 0.0.0.0
      ALLOW_REMOTE_ACCESS: "true"
      PUBLIC_AUTH_USERNAME: ${PUBLIC_AUTH_USERNAME:-admin}
      PUBLIC_AUTH_PASSWORD: ${PUBLIC_AUTH_PASSWORD:?Set PUBLIC_AUTH_PASSWORD in .env}
      PORT: "8787"
      DB_PATH: /app/data/squareforge.db
      TZ: Asia/Shanghai
      # Keys are configured in the panel and stored in the mounted database. Only set
      # these if you would rather supply them from the host environment:
      # OPENAI_API_KEY: ${OPENAI_API_KEY}

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 6s
      start_period: 30s
      retries: 3

volumes:
  squareforge-data:
