<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>squareforge · 广场内容工厂</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <span class="logo">sf</span>
      <div>
        <b>squareforge</b>
        <span>币安广场内容工厂</span>
      </div>
    </div>
    <nav id="nav" class="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>

  <div class="col">
    <header class="top">
      <div class="top-title">
        <h1 id="pageTitle">概览</h1>
        <p id="pageSub"></p>
      </div>
      <span class="top-spacer"></span>
      <div class="kv" id="topStatus"></div>
      <div class="top-actions">
        <button class="btn" onclick="act('collect')">抓取素材</button>
        <button class="btn" onclick="act('generate')">生成草稿</button>
        <button class="btn primary" id="pubBtn" onclick="publish()">发布</button>
        <button class="btn ghost" onclick="toggleTheme()" title="切换深浅色" aria-label="切换深浅色">
          <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 100 18 7.5 7.5 0 000-18z"/><path d="M12 3v18"/></svg>
        </button>
      </div>
    </header>
    <main id="main"></main>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
